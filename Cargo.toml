[package]
name = "ndpiviewer-rs"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"
repository = "https://github.com/Mancuerna/ndpiviewer-rs"
description = "A Windows viewer for NDPI slides and NDPIS fluorescence images"
default-run = "ndpiviewer-rs"
exclude = ["example_images/**"]

[features]
development-tools = []

[dependencies]
bioformats = { version = "=0.1.8", default-features = false, features = ["jpegxr"] }
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.15"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "=0.40.1"
semver = "1"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }

[profile.release]
debug = 1

[profile.dist]
inherits = "release"
debug = 0
strip = "symbols"

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish or retry (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: releases
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      created: ${{ steps.please.outputs.release_created }}
      tag: ${{ steps.please.outputs.tag_name || inputs.tag }}
      ref: ${{ steps.please.outputs.sha || inputs.tag }}
    steps:
      - uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4
        id: please
        if: github.event_name == 'push'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
      # Token-created PRs do not reliably trigger pull_request workflows.
      # workflow_dispatch runs the same required CI against the release branch.
      - name: Check the release pull request
        if: steps.please.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_BRANCH: ${{ fromJSON(steps.please.outputs.pr).headBranchName }}
        run: gh workflow run ci.yml --ref "$RELEASE_BRANCH"
  build:
    needs: prepare
    if: needs.prepare.outputs.created == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.prepare.outputs.ref }}
      release-tag: ${{ needs.prepare.outputs.tag }}
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
      - name: Retrieve and verify the draft installer
        run: gh release download "$RELEASE_TAG" --pattern '*-Setup.exe*' --dir dist
      - name: Verify release version and prepare first-release notes
        run: |
          python3 - <<'PY'
          import os, pathlib, re, tomllib
          tag = os.environ['RELEASE_TAG']
          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']['version']
          if not re.fullmatch(r'v\d+\.\d+\.\d+(?:-[\w.-]+)?', tag) or tag != 'v' + version:
              raise SystemExit('Tag must match Cargo.toml version.')
          files = list(pathlib.Path('dist').glob('*-Setup.exe'))
          if len(files) != 1 or files[0].name != f'NDPI-Viewer-{version}-Windows-x64-Setup.exe':
              raise SystemExit('Unexpected installer version.')
          import hashlib
          checksum = files[0].with_name(files[0].name + '.sha256').read_text().split()[0]
          if hashlib.sha256(files[0].read_bytes()).hexdigest().lower() != checksum.lower():
              raise SystemExit('Installer checksum mismatch.')
          changelog = pathlib.Path('CHANGELOG.md').read_text()
          sections = re.split(r'^## ', changelog, flags=re.M)
          pathlib.Path('release-notes.md').write_text('## ' + sections[1])
          PY
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action
        with:
          toolchain: '1.99.1'
      - name: Bundle corresponding source and locked dependencies
        run: |
          mkdir -p source/.cargo
          git archive HEAD | tar -x -C source
          cargo vendor --locked --versioned-dirs source/vendor > source/.cargo/config.toml
          python3 - <<'PY'
          import pathlib, re
          config = pathlib.Path('source/.cargo/config.toml')
          config.write_text(re.sub(r'^directory = .*$', 'directory = "vendor"', config.read_text(), flags=re.M))
          PY
          (cd source && cargo metadata --locked --offline --format-version 1 > /dev/null)
          tar -czf "dist/NDPI-Viewer-${RELEASE_TAG}-Source.tar.gz" -C source .
          (cd dist && sha256sum "NDPI-Viewer-${RELEASE_TAG}-Source.tar.gz" > "NDPI-Viewer-${RELEASE_TAG}-Source.tar.gz.sha256")
      - name: Publish only after all build checks pass
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" dist/*Source.tar.gz* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
